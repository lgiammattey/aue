<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>body{margin:0}a{color:var(--fg)}a:hover{color:var(--muted)}</style>
</helmet>
<div style="min-height:100vh;background:var(--page-bg);color:var(--fg);font-family:var(--font-body);padding:40px 32px;box-sizing:border-box">
<div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:40px">
<div><span style="font-family:var(--font-display);font-size:36px;text-transform:uppercase">Bonde do Arroto · Webapp</span><p style="color:var(--muted);font-size:16px;margin:8px 0 0">Mesmo app, três larguras. Desktop em 3 colunas, tablet com menu em ícones, celular com barra inferior.</p>
<div style="display:flex;gap:16px;margin-top:12px;font-size:15px"><a href="Landing.dc.html" style="color:var(--fg)">Landing</a><a href="Login.dc.html" style="color:var(--fg)">Login</a></div></div>
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="3">
<section style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:16px;align-items:baseline"><b style="font-size:18px">{{ f.title }}</b><span style="font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)">{{ f.size }}</span><a href="{{ f.src }}" style="color:var(--fg);font-size:14px">Abrir</a></div>
<div style="{{ f.box }}"><iframe src="{{ f.src }}" style="{{ f.frame }}" title="{{ f.title }}"></iframe></div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const mk = (title, src, w, h, k) => ({ title, src, size: w + ' × ' + h, box: { width: w * k, height: h * k, border: '1px solid var(--border)', borderRadius: 12, overflow: 'hidden', background: 'var(--bg)' }, frame: { width: w, height: h, border: 0, transform: 'scale(' + k + ')', transformOrigin: '0 0' } });
    return { frames: [mk('Desktop · Feed', 'Bonde do Arroto.dc.html', 1280, 800, 0.9), mk('Desktop · Arena', 'Arena.dc.html', 1280, 800, 0.9), mk('Tablet · Feed', 'Bonde do Arroto.dc.html', 820, 900, 0.8), mk('Celular · Feed', 'Bonde do Arroto.dc.html', 390, 844, 0.8), mk('Celular · Arena', 'Arena.dc.html', 390, 844, 0.8)] };
  }
}
</script>
</body>
</html>
