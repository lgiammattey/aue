    <meta name="theme-color" content="#0a0a08" />

    <!--
      A FONTE VEM DAQUI, E NÃO DE DENTRO DO CSS.

      Isto era um `@import` na primeira linha de `src/index.css`. Nesse formato o
      navegador só descobre a fonte DEPOIS de baixar o CSS: a requisição entra
      numa fila que ela mesma não podia ter começado, e o primeiro texto da Arena
      espera duas viagens em vez de uma. Aqui no `<head>` ele vê a fonte no
      primeiro byte do documento, e o `preconnect` já abre a conexão enquanto o
      resto baixa.

      `display=swap` é o que impede texto invisível esperando fonte: aparece na
      hora, no fallback, e troca quando a Archivo chega.

      Pesos 400, 600 e 700 porque são os únicos que o CSS do Auê usa. Quem
      precisar de 500 amanhã acrescenta nesta URL JUNTO com o CSS que usa — não
      antes.

      As quatro entradas HTML carregam isto igual, byte por byte.
      `src/fonte-nas-entradas.test.ts` derruba a suíte quando uma fica para trás.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      POR QUE ESTA PÁGINA TEM HTML PRÓPRIO

      `/grupos` é o diretório público de grupos de WhatsApp, Telegram e TikTok.
      Quem chega pelo Google precisa de um título, uma descrição e um canonical
      que sejam desta página, e não os da home. Ver `como-jogar.html` para o
      porquê completo.

      O <noscript> carrega a lista de grupos. O marcador abaixo é trocado no
      build por `scripts/gerar-paginas-de-grupos.ts` com os links para
      `/g/<slug>/`. Sem credencial do Supabase no build (CI de validação), o
      marcador continua aqui e a página sai só com o texto fixo. O conteúdo
      completo é montado pelo React (`src/features/grupos/TelaGrupos.tsx`).
    -->
    <meta
      name="description"
      content="Diretório de grupos de arroto e peido no WhatsApp, Telegram e TikTok. Entra num grupo ou cadastra o seu, sem criar conta."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/grupos" />

    <meta property="og:site_name" content="Auê" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Entra num grupo de arroto e peido ou cadastra o seu. Sem criar conta." />
