      POR QUE ESTA PÁGINA EXISTE

      "como arrotar", "como arrotar de propósito", "como arrotar alto" é o que
      as pessoas digitam. `/como-jogar` explica o JOGO e não responde nada
      disso. Esta responde o ARROTO, e termina empurrando pro jogo.

      O HTML de entrada é o mesmo mecanismo de `como-jogar.html`: sem ele, a
      hospedagem reescreve o caminho para o `index.html` e a URL seria servida
      com o título, a descrição e o `canonical` da HOME — brigando com o
      sitemap, que declara `/como-arrotar` como indexável. Nessa briga o
      canonical ganha e a página some do índice.

      OS SEIS PONTOS QUE ANDAM JUNTOS: este arquivo, o componente
      (`src/features/publico/ComoArrotar.tsx`), a entrada no `vite.config.ts`,
      o rewrite no `vercel.json`, o rewrite no `firebase.json` (antes do
      catch-all `**`) e a `<url>` no `public/sitemap.xml`. `src/qualidade/seo-publico.test.ts`
      é quem faz os seis se cobrarem.

      LIMITE DECLARADO: isto NÃO é prerender. O conteúdo completo é montado pelo
      React e só aparece com JavaScript. O `<noscript>` abaixo não é enfeite: é
      o que um rastreador sem execução de JS enxerga, e por isso ele carrega o
      texto de verdade.

      COM Open Graph, ao contrário de `como-jogar.html` até agora: este é o tipo
      de link que alguém joga no grupo pra provar um ponto ("ó, tem até
      tutorial"), e sem as tags o WhatsApp mostra o card da home — título e
      descrição de outra página. A imagem é a mesma `og-image.png` da home;
      imagem própria por página fica pro backlog.
    -->

    <noscript>
      <h1>Como arrotar</h1>
      <p>
        Não sabe arrotar? Dá pra aprender. Arroto é ar que entrou e resolveu
        voltar: a entrada dá pra treinar, o resto o corpo resolve sozinho.
      </p>

      <h2>Engole ar, devolve ar</h2>
      <p>
        Puxa ar pela boca como se fosse beber, mas em vez de engolir líquido você
        engole o ar. Prende um instante e solta pela garganta relaxada. As
        primeiras tentativas saem meia-boca. É normal.
      </p>

      <h2>Com refrigerante é trapaça? É, e funciona</h2>
      <p>
        Bebida com gás já entrega o ar pronto. Um gole, espera uns segundos,
        deixa subir. É o caminho mais fácil e ninguém vai te julgar por isso — o
        Auê julga o som, não o método.
      </p>

      <h2>Arrotar alto</h2>
      <p>
        Alto é garganta aberta e boca aberta na hora certa. Peito pra frente,
        queixo um pouco pra cima, e solta sem segurar no meio. Arroto abafado
        perde volume. Quando a Arena abrir, isso vai pesar na nota.
      </p>

      <h2>E se não sai nada?</h2>
      <p>
        Tem gente que simplesmente não arrota, e não tem técnica que resolva. Se
        forçar dói, incomoda ou vira azia, para — isso é assunto de médico, não
        de jogo. O Auê é brincadeira, não consultório.
      </p>

      <p>
        Aprendeu? A Arena está sendo preparada. Enquanto isso, conta como foi na comunidade.
      </p>
