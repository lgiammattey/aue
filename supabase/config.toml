# Mínimo para o Supabase CLI (link + db push) funcionar no CI e na sua máquina.
# O banco do Auê é o projeto remoto; não se roda stack local daqui.
project_id = "aue"

[functions.painel-administrativo]
enabled = true
verify_jwt = true
import_map = "./functions/painel-administrativo/deno.json"
entrypoint = "./functions/painel-administrativo/index.ts"

[functions.duelo-audio-v2]
enabled = true
verify_jwt = true
entrypoint = "./functions/duelo-audio-v2/index.ts"

[functions.notas-worker]
enabled = true
# Autenticação é feita pelo segredo exclusivo no handler, antes de qualquer acesso.
verify_jwt = false
entrypoint = "./functions/notas-worker/index.ts"
