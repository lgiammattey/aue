    <noscript>
      <h1>Tipos de arroto: do trovão ao sopro oco</h1>
      <p>
        O som do arroto é gerado pelo gás sob pressão subindo pelo esôfago e fazendo vibrar o
        esfíncter e as cordas vocais. Conheça as cinco variantes que a Arena vai avaliar quando abrir.
      </p>

      <h2>1. O Trovão</h2>
      <p>
        Potência bruta, impacto seco e ressonância grave no peito. Quando abrir, a Arena vai pesar isso na potência sonora.
      </p>

      <h2>2. O Trator</h2>
      <p>
        Vibração contínua e rítmica que dura vários segundos. Quando abrir, a Arena vai pesar isso na duração.
      </p>

      <h2>3. A Rajada</h2>
      <p>
        Sequência picotada de mini-arrotos encadeados sem respirar no meio.
      </p>

      <h2>4. O Fraseado</h2>
      <p>
        Modulação vocal para pronunciar palavras ou frases completas enquanto solta o ar.
      </p>

      <h2>5. O Sopro Oco</h2>
      <p>
        Muito ar e nenhum impacto acústico. Quando a Arena abrir, isso deve cair na faixa 'Foi isso?'.
      </p>
