      <h2>Recorde Mundial: 112,4 dB</h2>
      <p>
        Em 2021, o australiano Neville Sharp registrou 112,4 decibéis, o arroto mais alto da
        história. Kimberly Winter cravou o recorde feminino de 107,3 dB em 2023.
      </p>

      <h2>A Escala Oficial do Auê (0 a 100)</h2>
      <ul>
        <li>0 – 19: Foi isso?</li>
        <li>20 – 39: Tá fraco, hein.</li>
        <li>40 – 59: Dá pro gasto.</li>
        <li>60 – 74: Aí sim, porra.</li>
        <li>75 – 84: Caralho, veio forte.</li>
        <li>85 – 94: Tá maluco.</li>
        <li>95 – 99: Esse bagulho tá apelão.</li>
        <li>100: Tá roubado. Não é possível.</li>
      </ul>
