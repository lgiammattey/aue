<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>body{margin:0}a{color:var(--fg)}a:hover{color:var(--muted)}input::placeholder{color:var(--muted)}</style>
</helmet>
<div style="{{ rootStyle }}">
<div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px">
<a href="Landing.dc.html" style="color:var(--fg);font-family:var(--font-display);font-size:24px;text-decoration:none;text-align:center;letter-spacing:.02em">BONDE DO ARROTO</a>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;border-bottom:1px solid var(--border)">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="2"><button onClick="{{ m.go }}" style="{{ m.style }}">{{ m.label }}</button></sc-for>
</div>
<h1 style="font-family:var(--font-display);font-weight:400;font-size:32px;margin:4px 0 0;text-transform:uppercase;line-height:1.1">{{ titulo }}</h1>
<button onClick="{{ enter }}" style="height:48px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer" style-hover="background:var(--surface-2)">Continuar com Google</button>
<div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px"><span style="flex:1;height:1px;background:var(--border)"></span>ou<span style="flex:1;height:1px;background:var(--border)"></span></div>
<sc-if value="{{ isSignup }}"><input value="{{ nick }}" onInput="{{ setNick }}" placeholder="Apelido (ex: @voce_arrota)" style="{{ inputStyle }}"></input></sc-if>
<input value="{{ email }}" onInput="{{ setEmail }}" type="email" placeholder="E-mail" style="{{ inputStyle }}"></input>
<input value="{{ pass }}" onInput="{{ setPass }}" type="password" placeholder="Senha" style="{{ inputStyle }}"></input>
<sc-if value="{{ err }}"><span style="color:var(--danger);font-size:14px">{{ err }}</span></sc-if>
<button onClick="{{ submit }}" style="height:56px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-on);font-weight:700;font-size:17px;cursor:pointer" style-hover="background:var(--accent-strong)" style-active="transform:translateY(2px) scale(.985)">{{ cta }}</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center">
<a href="Arena.dc.html" style="color:var(--fg);font-weight:600;font-size:16px">Pular por enquanto</a>
<span style="color:var(--muted);font-size:14px;max-width:34ch">Sem conta você arrota na Arena e vê o feed. Pra postar, entrar em bonde e salvar o placar, precisa de conta.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'dark', mode: 'in', email: '', pass: '', nick: '', err: '' };
  componentDidMount() { try { const t = localStorage.getItem('bda-theme'); if (t) this.setState({ theme: t }); } catch (x) {} }
  enter = () => { window.location.href = 'Bonde do Arroto.dc.html'; };
  renderVals() {
    const s = this.state, light = s.theme === 'light', up = s.mode === 'up';
    const vars = light ? { '--bg': '#f5f3ea', '--surface': '#ebe9de', '--surface-2': '#dedcd0', '--fg': '#0a0a08', '--muted': '#6b6957', '--border': '#d6d4c6', colorScheme: 'light' } : { colorScheme: 'dark' };
    return {
      rootStyle: { ...vars, minHeight: '100vh', background: 'var(--bg)', color: 'var(--fg)', fontFamily: 'var(--font-body)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, boxSizing: 'border-box' },
      modes: [['in', 'Entrar'], ['up', 'Criar conta']].map(([k, l]) => ({ label: l, go: () => this.setState({ mode: k, err: '' }), style: { flex: 1, height: 44, background: 'none', border: 0, borderBottom: s.mode === k ? '3px solid var(--accent)' : '3px solid transparent', color: s.mode === k ? 'var(--fg)' : 'var(--muted)', fontWeight: s.mode === k ? 700 : 500, fontSize: 15, cursor: 'pointer', fontFamily: 'inherit' } })),
      isSignup: up, titulo: up ? 'Entra pro bonde.' : 'Bora de novo?', cta: up ? 'Criar conta' : 'Entrar',
      inputStyle: { height: 48, borderRadius: 12, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--fg)', padding: '0 14px', fontSize: 15, fontFamily: 'inherit', outline: 'none' },
      email: s.email, pass: s.pass, nick: s.nick, err: s.err,
      setEmail: (e) => this.setState({ email: e.target.value }), setPass: (e) => this.setState({ pass: e.target.value }), setNick: (e) => this.setState({ nick: e.target.value }),
      enter: this.enter,
      submit: () => {
        if (!s.email.includes('@')) return this.setState({ err: 'E-mail inválido.' });
        if (s.pass.length < 6) return this.setState({ err: 'Senha com no mínimo 6 caracteres.' });
        if (up && !s.nick.trim()) return this.setState({ err: 'Escolhe um apelido.' });
        this.enter();
      }
    };
  }
}
</script>
</body>
</html>
