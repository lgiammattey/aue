<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grupos externos de arroto: WhatsApp, Telegram e TikTok — Auê!</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      A FONTE VEM DAQUI, E NÃO DE DENTRO DO CSS.

      Anton e Archivo ficam em /fonts no mesmo domínio. Os preloads mostram os
      WOFF2 ao navegador no primeiro byte; as faces em src/index.css mantêm
      `font-display: swap` sem depender de uma conexão externa.

      Todas as entradas HTML carregam isto igual, byte por byte.
      `src/fonte-nas-entradas.test.ts` derruba a suíte quando uma fica para trás.
    -->
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      POR QUE ESTA PÁGINA TEM HTML PRÓPRIO

      `/grupos` é o diretório público de grupos de WhatsApp, Telegram e TikTok.
      Quem chega pelo Google precisa de um título, uma descrição e um canonical
      que sejam desta página, e não os da home. Ver `como-jogar.html` para o
      porquê completo.

      O <noscript> carrega a lista de grupos. O marcador abaixo é trocado no
      build por `scripts/gerar-paginas-de-grupos.ts` com os links para
      `/g/<slug>/`. Sem credencial do Supabase no build (CI de validação), o
      marcador continua aqui e a página sai só com o texto fixo. O conteúdo
      completo é montado pelo React (`src/features/grupos/TelaGrupos.tsx`).
    -->
    <meta
      name="description"
      content="Diretório de grupos de arrotadores no WhatsApp, Telegram e TikTok, cadastrados pela galera. São grupos externos: as comunidades do Auê ficam no app."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/grupos" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auê" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://aue.web.app/grupos" />
    <meta property="og:title" content="Grupos externos de arroto: WhatsApp, Telegram e TikTok — Auê!" />
    <meta property="og:description" content="Grupos de arrotadores no WhatsApp, Telegram e TikTok. São externos ao Auê, cuja comunidade fica no app." />
    <meta property="og:image" content="https://aue.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Símbolo do Auê: uma bolha verde-limão com um ponto de exclamação vazado." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grupos externos de arroto: WhatsApp, Telegram e TikTok — Auê!" />
    <meta name="twitter:description" content="Grupos de arrotadores no WhatsApp, Telegram e TikTok. São externos ao Auê, cuja comunidade fica no app." />
    <meta name="twitter:image" content="https://aue.web.app/og-image.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Grupos externos de arroto: WhatsApp, Telegram e TikTok — Auê!",
        "description": "Diretório de grupos de arrotadores no WhatsApp, Telegram e TikTok, cadastrados pela galera. São grupos externos: as comunidades do Auê ficam no app.",
        "url": "https://aue.web.app/grupos",
        "inLanguage": "pt-BR",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Auê!",
          "url": "https://aue.web.app/"
        }
      }
    </script>

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5542349230926522"
      crossorigin="anonymous"
    ></script>
  </head>
