<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>@keyframes bdaFade{from{opacity:0}to{opacity:1}}@keyframes bdaPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}@keyframes bdaHeart{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.92)}100%{transform:scale(1)}}@keyframes bdaUp{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes bdaIn{from{opacity:0;transform:translateY(-8px);background:var(--fg-soft)}to{opacity:1;transform:none}}button,a{transition:background-color .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease,transform .1s ease}button:active:not([disabled]){transform:scale(.96)}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}body{margin:0}a{color:var(--fg);text-decoration:none}a:hover{color:var(--muted)}@media (max-width:900px){[data-split]{flex-direction:column!important}[data-mark]{flex:none!important;padding:40px 24px 0!important;justify-content:flex-start!important}[data-form]{padding:24px!important;flex:none!important}}</style>
</helmet>
<div style="{{ rootStyle }}">
<div data-split="1" style="flex:1;display:flex;min-height:0">

<div data-mark="1" style="flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:12px;max-width:520px">
<span style="font-family:var(--font-display);font-size:clamp(120px,24vw,300px);line-height:.9;text-transform:uppercase"><span style="background:var(--accent);color:var(--accent-on);padding:0 .1em;border-radius:.1em;display:inline-block">Auê!</span></span>
</div>
</div>

<div data-form="1" style="flex:1 1 50%;display:flex;flex-direction:column;justify-content:center;padding:32px 48px;box-sizing:border-box;gap:0">
<h1 style="font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1.05;letter-spacing:-.02em;margin:0 0 40px">Tá rolando agora</h1>
<h2 style="font-weight:800;font-size:clamp(24px,3.2vw,31px);line-height:1.15;margin:0 0 24px">Entra no bonde hoje.</h2>
<div style="display:flex;flex-direction:column;gap:12px;max-width:300px">
<a href="Login.dc.html" style="height:40px;border-radius:999px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px" style-hover="opacity:.88;color:var(--bg)">Continuar com Google</a>
<a href="Login.dc.html" style="height:40px;border-radius:999px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px" style-hover="opacity:.88;color:var(--bg)">Continuar com Apple</a>
<div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px"><span style="flex:1;height:1px;background:var(--border)"></span>ou<span style="flex:1;height:1px;background:var(--border)"></span></div>
<a href="Login.dc.html" style="height:40px;border-radius:999px;background:var(--accent);color:var(--accent-on);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px" style-hover="background:var(--accent-strong);color:var(--accent-on)" style-active="transform:translateY(2px) scale(.985)">Criar conta</a>
<span style="color:var(--muted);font-size:12px;line-height:1.4;margin-top:-4px">Ao se cadastrar, você aceita os Termos e a Política de Privacidade. A piada é com o arroto, nunca com a pessoa.</span>
</div>
<div style="display:flex;flex-direction:column;gap:12px;max-width:300px;margin-top:40px">
<span style="font-weight:700;font-size:17px">Já tem uma conta?</span>
<a href="Login.dc.html" style="height:40px;border-radius:999px;border:1px solid var(--border-strong);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--fg)" style-hover="background:var(--surface)">Entrar</a>
<a href="Arena.dc.html" style="height:40px;border-radius:999px;border:1px solid var(--border-strong);color:var(--fg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px" style-hover="background:var(--surface)">Arrotar sem conta</a>
</div>
</div>
</div>

<footer style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 16px;padding:12px 16px 16px;color:var(--muted);font-size:13px">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="8"><a href="#" style="color:var(--muted)" style-hover="text-decoration:underline">{{ l }}</a></sc-for>
<button onClick="{{ toggleTheme }}" style="border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0" style-hover="text-decoration:underline">{{ themeLabel }}</button>
<span>© 2026 Auê!</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'dark' };
  componentDidMount() { try { const t = localStorage.getItem('bda-theme'); if (t) this.setState({ theme: t }); } catch (x) {} }
  renderVals() {
    const light = this.state.theme === 'light';
    const vars = light ? { '--bg': '#f5f3ea', '--surface': '#ebe9de', '--surface-2': '#dedcd0', '--fg': '#0a0a08', '--muted': '#57554a', '--border': '#d6d4c6', '--border-strong': '#85836f', '--ind': '#0a0a08', '--danger': '#c4161a', colorScheme: 'light' } : { '--border-strong': '#74725f', '--ind': '#c6ff00', colorScheme: 'dark' };
    return {
      rootStyle: { ...vars, background: 'var(--bg)', color: 'var(--fg)', fontFamily: 'var(--font-body)', minHeight: '100vh', display: 'flex', flexDirection: 'column' },
      themeLabel: light ? 'Tema escuro' : 'Tema claro',
      toggleTheme: () => { const t = light ? 'dark' : 'light'; this.setState({ theme: t }); try { localStorage.setItem('bda-theme', t); } catch (x) {} },
      links: ['Sobre', 'Como funciona', 'Comunidades', 'Regras da casa', 'Privacidade', 'Termos', 'Contato']
    };
  }
}
</script>
</body>
</html>
