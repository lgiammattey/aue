<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      O `.ico` NÃO é redundância do `.svg` de cima.

      Quem não entende o SVG — navegador antigo, robô de prévia de link, leitor
      de feed, site fixado no Windows — vai direto em `/favicon.ico`, sem
      perguntar ao HTML. E o `vercel.json` reescreve tudo que não é arquivo
      para o `index.html`, então esse pedido vinha respondendo **200 com uma
      página HTML** disfarçada de ícone: o pior tipo de erro, o que finge que
      deu certo.

      Com o arquivo em `public/`, a hospedagem serve o arquivo antes de
      qualquer reescrita. Ele tem 16, 32 e 48 dentro, e vem do mesmo símbolo do
      design system.
    -->
    <!--
      `viewport-fit=cover` NAO e enfeite: sem ele o Safari do iPhone devolve
      ZERO em todo `env(safe-area-inset-*)`. A barra de navegacao do app ja
      pedia `env(safe-area-inset-bottom)` e vinha recebendo zero desde sempre —
      ela parecia respeitar a faixa do gesto e nao respeitava (#69).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      O TÍTULO DIZ QUEM SOMOS: "a comunidade de quem gosta de arrotar".

      Até 19/10/2026 o título e a descrição chamavam o Auê de "jogo de arroto
      online". Luiz mudou o posicionamento: o Auê é uma comunidade, e a Arena
      (onde o arroto ganha nota) é uma das coisas que ela oferece, não a
      identidade inteira. Voz e regras de copy: `docs/jogo/VOZ.md`, seção
      "Direção editorial".
    -->
    <title>Auê! — A comunidade de quem gosta de arrotar</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      A FONTE VEM DAQUI, E NÃO DE DENTRO DO CSS.

      Isto era um `@import` na primeira linha de `src/index.css`. Nesse formato o
      navegador só descobre a fonte DEPOIS de baixar o CSS: a requisição entra
      numa fila que ela mesma não podia ter começado, e o primeiro texto da Arena
      espera duas viagens em vez de uma. Aqui no `<head>` ele vê a fonte no
      primeiro byte do documento, e o `preconnect` já abre a conexão enquanto o
      resto baixa.

      `display=swap` é o que impede texto invisível esperando fonte: aparece na
      hora, no fallback, e troca quando a Archivo chega.

      Pesos 400, 600 e 700 porque são os únicos que o CSS do Auê usa. Quem
      precisar de 500 amanhã acrescenta nesta URL JUNTO com o CSS que usa — não
      antes.

      As quatro entradas HTML carregam isto igual, byte por byte.
      `src/fonte-nas-entradas.test.ts` derruba a suíte quando uma fica para trás.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!--
      iOS: "Adicionar à Tela de Início".

      Ninguém no app ensina nem oferece esse gesto: a landing perdeu o botão de
      instalar na #138, e o app não registra `beforeinstallprompt` — quem
      promove instalação é o navegador. Mas o gesto continua existindo no
      Safari, onde ele é o único caminho, e quem descobre sozinho merece um
      ícone decente. Sem as tags abaixo, sai um ícone genérico — miniatura da
      captura da página, com a barra de endereço dentro — e um app que abre
      dentro do Safari, com barra de navegação e tudo.

      O manifest NÃO resolve isto sozinho: o Safari só passou a ler `icons` do
      manifest recentemente e continua preferindo `apple-touch-icon`. Nenhuma
      destas tags tem efeito fora do iOS/iPadOS.

      `apple-touch-icon.png` é 180x180 sem canal alfa, gerado a partir de
      public/pwa-512x512.png — o iOS não compõe transparência, ele pinta o que
      sobra de preto.

      `black` e não `black-translucent` no status bar: o translúcido joga o
      conteúdo para debaixo do relógio e da bateria, e a barra do app já é
      escura. O ganho seria zero e o custo seria um cabeçalho cortado.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />

    <!--
      SEO.

      DOMÍNIO ATUAL: https://aue.web.app, virado em 2026-08-10 por decisão do
      Luiz depois que a hospedagem nova foi validada em celular (#137).

      Antes dele foi `aue.vercel.app`, confirmado em 2026-08-08, e antes disso
      `canonical`, `og:url` e `og:image` estavam ausentes DE PROPÓSITO — o
      domínio era suposição (aue.app), e um canonical apontando para um domínio
      que não é o publicado é o pior caso possível de SEO: instrui o buscador a
      não indexar a URL real.

      `aue.vercel.app` CONTINUA NO AR e continua respondendo aos links que já
      circularam. O que mudou é qual dos dois é o oficial.

      Se o domínio mudar (um aue.app de verdade, por exemplo), estes lugares
      mudam JUNTOS, senão o canonical passa a mentir:
        1. este arquivo (canonical, og:url, og:image, twitter:image, JSON-LD)
        2. privacidade.html e termos.html (o canonical de cada uma)
        3. public/robots.txt
        4. public/sitemap.xml
        5. src/shared/desktop/enderecoPublico.ts (QR Code e "copiar link")

      Todos estão travados por src/seo-publico.test.ts: mudar um e esquecer os
      outros quebra o teste. Havia um sexto, a Edge Function og-preview, que era
      conferência à mão — saiu do ar e do repositório em 13/08, junto com a
      prévia do link (docs/technical/adr/0003-a-previa-do-link.md §10).

      ESTE canonical vale para a HOME, e só para ela. Cada rota indexável tem o
      seu próprio HTML de entrada com o seu próprio canonical — antes existia um
      arquivo só, o rewrite da Vercel servia ele em qualquer caminho, e
      /privacidade era entregue declarando a home como canônica enquanto o
      sitemap jurava que /privacidade era indexável. Os dois não podem
      discordar: o canonical ganha, e a página some do índice.

      A descrição NÃO fala mais em "ranking global, XP e níveis": as três
      coisas existem em código mas estão DESLIGADAS no corte de lançamento
      (src/shared/flags.ts). Prometer no buscador o que a tela não entrega é a
      pior primeira impressão possível.
    -->
    <meta name="description" content="Comunidade de arrotadores: histórias, áudios e a Arena, onde você solta um arroto e vê a nota. Arrota, aprende ou só vem ouvir." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/" />

    <!--
      Open Graph ESTÁTICO: este é o card de quem compartilha a home ou um link
      de batalha, e é o único que existe. O card DINÂMICO por batalha, com a
      nota de quem desafiou, foi TENTADO e NÃO DEU: o gateway do Supabase não
      deixa a Edge Function servir HTML no domínio compartilhado. A #143 fechou
      aceitando este card aqui, e a nota viaja como imagem pela #151. O caminho
      inteiro, com o que foi testado, está em
      docs/technical/adr/0003-a-previa-do-link.md §10 — leia antes de tentar de
      novo.

      `og:image` voltou porque public/og-image.png agora EXISTE (1200x630,
      gerado a partir do símbolo oficial da marca). Enquanto ele não existia, a
      tag apontava para 404 — o que não produz imagem nenhuma e ainda faz
      validadores reportarem erro. Se o arquivo for removido, remova a tag
      junto.

      Isto não é decoração: é a imagem que WhatsApp, Telegram e X mostram
      quando alguém manda o link da batalha. Sem ela, o convite chega como um
      link pelado num grupo de família.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auê" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://aue.web.app/" />
    <meta property="og:title" content="Auê! — A comunidade de quem gosta de arrotar" />
    <meta property="og:description" content="Arrotar é um dom. Aqui, ele tem turma. Arrota, aprende ou só vem ouvir." />
    <meta property="og:image" content="https://aue.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Símbolo do Auê: uma bolha verde-limão com um ponto de exclamação vazado." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auê! — A comunidade de quem gosta de arrotar" />
    <meta name="twitter:description" content="Arrotar é um dom. Aqui, ele tem turma. Arrota, aprende ou só vem ouvir." />
    <meta name="twitter:image" content="https://aue.web.app/og-image.png" />

    <!--
      Dados estruturados. O app é uma SPA: até o JavaScript rodar, o buscador
      só tem o <title>, a description e o <noscript> abaixo. Este bloco dá a
      ele um fato a mais que não depende de renderização — o que é o produto,
      em que idioma, e que é de graça.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Auê!",
        "alternateName": "Auê — comunidade de arrotadores",
        "url": "https://aue.web.app/",
        "description": "Comunidade de quem gosta de arrotar: histórias, áudios e a Arena, onde você solta um arroto e recebe uma nota de 0 a 100.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Navegador com suporte a microfone",
        "inLanguage": "pt-BR",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
        "potentialAction": {
          "@type": "ViewAction",
          "name": "Como funciona",
          "target": "https://aue.web.app/como-jogar"
        }
      }
    </script>

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5542349230926522"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      O que existe sem JavaScript.

      Não é acessibilidade teórica: é o único conteúdo que um rastreador sem
      execução de JS enxerga desta página. A landing de desktop
      (src/features/desktop/TelaDesktop.tsx) é o conteúdo indexável de
      verdade, mas ela depende do React ter montado.
    -->
    <noscript>
      <h1>Auê! — a comunidade de quem gosta de arrotar</h1>
      <p>
        Arrotar é um dom. No Auê, ele tem turma: comunidades de arrotadores,
        histórias, áudios e a Arena, onde você solta um arroto e recebe uma
        nota de 0 a 100.
      </p>
      <p>
        Arrota, aprende ou só vem ouvir. Qualquer pessoa pode ler e ouvir sem
        conta. Funciona direto no navegador, de graça, sem instalar nada.
      </p>
      <p>
        <a href="/comunidade">Comunidades</a> ·
        <a href="/como-jogar">Como funciona</a> ·
        <a href="/como-arrotar">Como arrotar</a> ·
        <a href="/tipos-de-arroto">Tipos de arroto</a> ·
        <a href="/ranking-de-arrotos">Ranking de arrotos</a>
      </p>
      <p>Para usar o Auê é preciso ativar o JavaScript no navegador.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
