      <h1>Ranking de arrotos no Auê</h1>
      <p>A Arena já permite gravar e ouvir sua tentativa. O ranking ainda não está disponível.</p>
      <h2>O que a Arena mede?</h2>
      <p>Quando a medição funciona, o laudo mostra a duração detectada e um índice de potência relativo ao ruído do ambiente. A leitura depende do aparelho e do lugar onde você gravou.</p>
      <p>Esse índice não mede volume físico em decibéis. A frequência ainda aparece como indisponível, e uma gravação também pode ficar sem laudo.</p>
      <h2>O Auê tem ranking de arrotos?</h2>
      <p>Ainda não há ranking de arrotos. A Arena oferece gravação e laudo experimental no navegador.</p>
      <p>A gravação fica na sua tela até você escolher compartilhá-la ou baixá-la.</p>
