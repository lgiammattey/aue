        O Auê é o jogo de arroto online onde a zoeira ganha contexto.
        Aqui você encontra o Feed de Causos e as Comunidades temáticas
        com as maiores histórias e vergonhas de arroto do Brasil.
      </p>

      <h2>O Bonde do Arroto</h2>
      <p>
        No feed do Auê, cada arroto conta um causo real: na reunião da firma,
        no primeiro encontro ou no churrasco de domingo.
        Ouça o áudio, veja a nota oficial dada pelo juiz de inteligência artificial
        e desafie qualquer um no X1 pelo WhatsApp.
      </p>

      <h2>As Comunidades Temáticas</h2>
      <p>
        Participe dos bondes temáticos como "Eu arroto, e daí?", "Na reunião da firma",
        "Primeiro encontro", "Arroto trovão" e "Cerveja & Churrasco".
      </p>
